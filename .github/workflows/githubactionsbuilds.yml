name: GitHubActionsBuilds

on:
  push:
  workflow_dispatch:

jobs:
  generate_version_number:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.buildnumber.outputs.build_number }}
    steps:
    - name: Generate build number
      id: buildnumber
      uses: onyxmueller/build-tag-number@v1
      with:
        token: ${{secrets.github_token}}

  build_docker:
    needs: generate_version_number
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Login to Docker Hub
      if: github.actor != 'dependabot[bot]'
      uses: docker/login-action@v4
      with:
        username: devedse
        password: ${{ secrets.DOCKERHUBTOKEN }}
    - name: Set up QEMU
      id: qemu
      uses: docker/setup-qemu-action@v4
      with:
        image: tonistiigi/binfmt:latest
        platforms: all
    - name: Available platforms
      run: echo ${{ steps.qemu.outputs.platforms }}
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
    - name: Builder instance name
      run: echo ${{ steps.buildx.outputs.name }}
    - name: Available platforms
      run: echo ${{ steps.buildx.outputs.platforms }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: devedse/devecoollibconsoleapp
        tags: |
          type=raw,value=1.0.${{needs.generate_version_number.outputs.build_number}},enable=${{ github.ref == 'refs/heads/master' }}
          type=raw,value=1.0.${{needs.generate_version_number.outputs.build_number}}-beta,enable=${{ github.ref != 'refs/heads/master' }}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          type=ref,event=branch,prefix=beta_,enable=${{ github.ref != 'refs/heads/master' }}
          type=raw,value=beta_nightly,enable=${{ github.actor != 'dependabot[bot]' }}
        labels: |
          maintainer=${{ github.actor }}
          org.opencontainers.image.description=DeveCoolLib ConsoleApp - Multi-architecture Docker image
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: DeveCoolLib.ConsoleApp/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        tags: ${{ steps.meta.outputs.tags }}
        annotations: ${{ steps.meta.outputs.annotations }}
        build-args: |
          BUILD_VERSION=1.0.${{needs.generate_version_number.outputs.build_number}}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        provenance: false
        sbom: false

  
  build_linux:
    needs: generate_version_number
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: dotnet restore
      run: dotnet restore DeveCoolLib.slnx
    - name: dotnet build
      run: dotnet build DeveCoolLib.slnx -c Release --no-restore /p:Version=1.0.${{needs.generate_version_number.outputs.build_number}}
    - name: dotnet test
      run: dotnet test DeveCoolLib.slnx -c Release --no-build --verbosity normal

  build_linux_with_sonarqube:
    needs: generate_version_number
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '21' # The JDK version to make available on the path.
        java-package: jdk # (jre, jdk, or jdk+fx) - defaults to jdk
        architecture: x64 # (x64 or x86) - defaults to x64
    - name: Install tools
      run: |
        dotnet tool install --global dotnet-sonarscanner
        dotnet tool install --global dotnet-reportgenerator-globaltool
    - name: dotnet restore
      run: dotnet restore DeveCoolLib.slnx
    - name: SonarQube begin
      if: github.actor != 'dependabot[bot]'
      run: dotnet-sonarscanner begin /k:"DeveCoolLib" /o:"devedse-github" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token=${{secrets.SONARQUBETOKEN}} /d:sonar.cs.opencover.reportsPaths=".\DeveCoolLib.Tests\TestResults\*\coverage.opencover.xml" /d:sonar.coverage.exclusions="DeveCoolLib.ConsoleApp/**/*.cs,DeveCoolLib.Tests/**/*.cs"
    - name: dotnet build
      run: dotnet build DeveCoolLib.slnx -c Release --no-restore /p:Version=1.0.${{needs.generate_version_number.outputs.build_number}}
    - name: dotnet test
      run: dotnet test DeveCoolLib.slnx --verbosity normal --no-build -c Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover
    - name: SonarQube end
      if: github.actor != 'dependabot[bot]'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet-sonarscanner end /d:sonar.token=${{secrets.SONARQUBETOKEN}}
    - name: Pack
      run: dotnet pack DeveCoolLib/DeveCoolLib.csproj --verbosity normal --no-build -c Release /p:Version=1.0.${{needs.generate_version_number.outputs.build_number}}
    - name: Run CodeCov
      if: github.actor != 'dependabot[bot]'
      uses: codecov/codecov-action@v7
      with:
        directory: ./DeveCoolLib.Tests/TestResults
        fail_ci_if_error: true # optional (default = false)
        verbose: true # optional (default = false)
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Package DeveCoolLib
      run: |
        # Create output directory
        mkdir -p Scripts/Output
        
        # Remove existing files if they exist
        rm -f Scripts/Output/DeveCoolLib.7z
        rm -f Scripts/Output/DeveCoolLib.zip
        
        # Package the build output
        cd DeveCoolLib/bin/Release
        
        # Create zip file (excluding .pdb files)
        zip -r ../../../Scripts/Output/DeveCoolLib.zip . -x "*.pdb"
        
        # Create 7z file (excluding .pdb files)
        7z a -t7z -m0=LZMA2 -mmt=on -mx9 -md=1536m -mfb=273 -ms=on -mqs=on -sccUTF-8 "../../../Scripts/Output/DeveCoolLib.7z" . -x!"*.pdb"
      shell: bash
  

    - uses: actions/upload-artifact@v7
      with:
        name: DeveCoolLib7z
        path: ./Scripts/Output/DeveCoolLib.7z
    - uses: actions/upload-artifact@v7
      with:
        name: DeveCoolLibZip
        path: ./Scripts/Output/DeveCoolLib.zip
    - uses: actions/upload-artifact@v7
      with:
        name: DeveCoolLibNuGet
        path: |
          ./DeveCoolLib/bin/Release/*.nupkg
          ./DeveCoolLib/bin/Release/*.snupkg

  build_linux_consoleapp:
    needs: generate_version_number
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Publish Untrimmed
      run: dotnet publish DeveCoolLib.ConsoleApp/DeveCoolLib.ConsoleApp.csproj -c Release -r linux-x64 -o DeveCoolLib.ConsoleApp/bin/Release/net10.0/linux-x64/publishuntrimmed/ /p:PublishSingleFile=true /p:SelfContained=true /p:Version=1.0.${{needs.generate_version_number.outputs.build_number}}
    - name: Publish Trimmed
      run: dotnet publish DeveCoolLib.ConsoleApp/DeveCoolLib.ConsoleApp.csproj -c Release -r linux-x64 -o DeveCoolLib.ConsoleApp/bin/Release/net10.0/linux-x64/publishtrimmed/ /p:PublishSingleFile=true /p:SelfContained=true /p:PublishTrimmed=true /p:TrimMode=full /p:Version=1.0.${{needs.generate_version_number.outputs.build_number}}
    - name: Publish Trimmed AOT
      run: dotnet publish DeveCoolLib.ConsoleApp/DeveCoolLib.ConsoleApp.csproj -c Release -r linux-x64 -o DeveCoolLib.ConsoleApp/bin/Release/net10.0/linux-x64/publishtrimmedaot/ /p:PublishTrimmed=true /p:TrimMode=full /p:PublishAot=true /p:Version=1.0.${{needs.generate_version_number.outputs.build_number}}
    - name: Copy output
      shell: bash
      run: |
        mkdir BuildOutputConsole
        mv ./DeveCoolLib.ConsoleApp/bin/Release/net10.0/linux-x64/publishuntrimmed/DeveCoolLib.ConsoleApp ./BuildOutputConsole/DeveCoolLib.ConsoleApp.Untrimmed
        mv ./DeveCoolLib.ConsoleApp/bin/Release/net10.0/linux-x64/publishtrimmed/DeveCoolLib.ConsoleApp ./BuildOutputConsole/DeveCoolLib.ConsoleApp.Trimmed
        mv ./DeveCoolLib.ConsoleApp/bin/Release/net10.0/linux-x64/publishtrimmedaot/DeveCoolLib.ConsoleApp ./BuildOutputConsole/DeveCoolLib.ConsoleApp.TrimmedAot
    - uses: actions/upload-artifact@v7
      with:
        name: DeveCoolLib.ConsoleApp.Linux
        path: BuildOutputConsole/*

  build_windows_consoleapp:
    needs: generate_version_number
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Publish Untrimmed
      run: dotnet publish DeveCoolLib.ConsoleApp/DeveCoolLib.ConsoleApp.csproj -c Release -r win-x64 -o DeveCoolLib.ConsoleApp/bin/Release/net10.0/win-x64/publishuntrimmed/ /p:PublishSingleFile=true /p:SelfContained=true /p:Version=1.0.${{needs.generate_version_number.outputs.build_number}}
    - name: Publish Trimmed
      run: dotnet publish DeveCoolLib.ConsoleApp/DeveCoolLib.ConsoleApp.csproj -c Release -r win-x64 -o DeveCoolLib.ConsoleApp/bin/Release/net10.0/win-x64/publishtrimmed/ /p:PublishSingleFile=true /p:SelfContained=true /p:PublishTrimmed=true /p:TrimMode=full /p:Version=1.0.${{needs.generate_version_number.outputs.build_number}}
    - name: Publish Trimmed AOT
      run: dotnet publish DeveCoolLib.ConsoleApp/DeveCoolLib.ConsoleApp.csproj -c Release -r win-x64 -o DeveCoolLib.ConsoleApp/bin/Release/net10.0/win-x64/publishtrimmedaot/ /p:PublishTrimmed=true /p:TrimMode=full /p:PublishAot=true /p:Version=1.0.${{needs.generate_version_number.outputs.build_number}}
    - name: Copy output
      shell: bash
      run: |
        mkdir BuildOutputConsole
        mv ./DeveCoolLib.ConsoleApp/bin/Release/net10.0/win-x64/publishuntrimmed/DeveCoolLib.ConsoleApp.exe ./BuildOutputConsole/DeveCoolLib.ConsoleApp.Untrimmed.exe
        mv ./DeveCoolLib.ConsoleApp/bin/Release/net10.0/win-x64/publishtrimmed/DeveCoolLib.ConsoleApp.exe ./BuildOutputConsole/DeveCoolLib.ConsoleApp.Trimmed.exe
        mv ./DeveCoolLib.ConsoleApp/bin/Release/net10.0/win-x64/publishtrimmedaot/DeveCoolLib.ConsoleApp.exe ./BuildOutputConsole/DeveCoolLib.ConsoleApp.TrimmedAot.exe
    - uses: actions/upload-artifact@v7
      with:
        name: DeveCoolLib.ConsoleApp.Windows
        path: BuildOutputConsole/*

  release_github:
    permissions:
      contents: write
    needs: [generate_version_number, build_linux_with_sonarqube, build_linux, build_docker, build_linux_consoleapp, build_windows_consoleapp]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./artifacts/

    - name: Display structure of downloaded files
      run: |
        cd ./artifacts/
        ls -R
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: 1.0.${{needs.generate_version_number.outputs.build_number}}
        name: 1.0.${{needs.generate_version_number.outputs.build_number}}
        body: |
          ${{ github.event.head_commit.message }}
        files: |
          ./artifacts/DeveCoolLib7z/DeveCoolLib.7z
          ./artifacts/DeveCoolLibZip/DeveCoolLib.zip
          ./artifacts/DeveCoolLibNuGet/*.nupkg
          ./artifacts/DeveCoolLibNuGet/*.snupkg
          ./artifacts/DeveCoolLib.ConsoleApp.Linux/DeveCoolLib.ConsoleApp.Untrimmed
          ./artifacts/DeveCoolLib.ConsoleApp.Linux/DeveCoolLib.ConsoleApp.Trimmed
          ./artifacts/DeveCoolLib.ConsoleApp.Linux/DeveCoolLib.ConsoleApp.TrimmedAot
          ./artifacts/DeveCoolLib.ConsoleApp.Windows/DeveCoolLib.ConsoleApp.Untrimmed.exe
          ./artifacts/DeveCoolLib.ConsoleApp.Windows/DeveCoolLib.ConsoleApp.Trimmed.exe
          ./artifacts/DeveCoolLib.ConsoleApp.Windows/DeveCoolLib.ConsoleApp.TrimmedAot.exe
        fail_on_unmatched_files: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release_nuget:
    needs: [generate_version_number, build_linux_with_sonarqube, build_linux, build_docker, build_linux_consoleapp, build_windows_consoleapp, release_github]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        name: DeveCoolLibNuGet
        path: ./artifacts/DeveCoolLibNuGet/
    - name: Push NuGet
      run: dotnet nuget push ./artifacts/DeveCoolLibNuGet/DeveCoolLib.1.0.${{needs.generate_version_number.outputs.build_number}}.nupkg -k ${{ secrets.NUGETTOKEN }} -s https://api.nuget.org/v3/index.json
